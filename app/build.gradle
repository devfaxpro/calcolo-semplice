plugins { id 'com.android.application' }

android {
    namespace 'it.calcolosemplice.app'
    compileSdk 36
    defaultConfig {
        applicationId 'it.calcolosemplice.app'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Android Gradle Plugin generates a local development signing key.
    buildTypes {
        release { minifyEnabled false }
    }
}
